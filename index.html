<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamBIM GUID Widget</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, sans-serif;
        background-color: #f5f5f5;
        padding: 20px;
      }

      #app {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 16px;
        color: #333;
      }

      .info-section {
        background-color: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 16px;
        margin-bottom: 16px;
      }

      .info-label {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      .guid {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        color: #333;
        word-break: break-all;
        background-color: #fff;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #ddd;
      }

      .status {
        font-size: 13px;
        color: #999;
        margin-top: 16px;
        text-align: center;
        padding: 12px;
        background-color: #fafafa;
        border-radius: 4px;
        border-left: 3px solid #2196f3;
      }

      .status.active {
        border-left-color: #4caf50;
        color: #333;
      }
    </style>
    <script src="./node_modules/streambim-widget-api/dist/streambim-widget-api.min.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>StreamBIM GUID Widget</h1>
      <div class="info-section">
        <div class="info-label">Selected Element GUID</div>
        <div class="guid" id="guidDisplay">No element selected</div>
      </div>
      <div class="status" id="status">Connecting to StreamBIM...</div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>

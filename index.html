<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamBIM GUID Widget</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, sans-serif;
        background-color: #f5f5f5;
        padding: 20px;
      }

      #app {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 16px;
        color: #333;
      }

      .info-section {
        background-color: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 16px;
        margin-bottom: 16px;
      }

      .info-label {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      .guid {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        color: #333;
        word-break: break-all;
        background-color: #fff;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #ddd;
      }

      .status {
        font-size: 13px;
        color: #999;
        margin-top: 16px;
        text-align: center;
        padding: 12px;
        background-color: #fafafa;
        border-radius: 4px;
        border-left: 3px solid #2196f3;
      }

      .status.active {
        border-left-color: #4caf50;
        color: #333;
      }

      .elements-list {
        margin-top: 20px;
      }

      .elements-list h2 {
        font-size: 14px;
        color: #666;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .element-item {
        display: flex;
        align-items: center;
        padding: 12px;
        margin-bottom: 8px;
        background-color: #fafafa;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .element-item:hover {
        background-color: #f0f0f0;
        border-color: #2196f3;
      }

      .element-item.selected {
        background-color: #e3f2fd;
        border-color: #2196f3;
      }

      .element-item input[type="checkbox"] {
        margin-right: 12px;
        cursor: pointer;
        width: 18px;
        height: 18px;
      }

      .element-item-guid {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: #333;
        word-break: break-all;
        flex: 1;
      }

      .clear-button {
        margin-top: 12px;
        padding: 8px 16px;
        background-color: #f44336;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background-color 0.2s ease;
      }

      .clear-button:hover {
        background-color: #d32f2f;
      }

      .clear-button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      .empty-state {
        text-align: center;
        color: #999;
        padding: 20px;
        font-size: 13px;
      }

      .properties-section {
        background-color: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 16px;
        margin-top: 16px;
        font-size: 13px;
      }

      .properties-section h3 {
        margin: 0 0 12px 0;
        font-size: 13px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .property-item {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e0e0e0;
      }

      .property-item:last-child {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      .property-key {
        font-weight: 600;
        color: #333;
        font-size: 12px;
      }

      .property-value {
        color: #666;
        font-size: 12px;
        word-break: break-word;
        margin-top: 4px;
        font-family: 'Courier New', monospace;
      }
    </style>
    <script src="./node_modules/streambim-widget-api/dist/streambim-widget-api.min.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>StreamBIM GUID Widget</h1>
      <div class="info-section">
        <div class="info-label">Current Element</div>
        <div class="guid" id="currentGuid">No element selected</div>
      </div>
      <div id="propertiesContainer"></div>
      <div class="elements-list">
        <h2>Selected Elements</h2>
        <div id="elementsList"></div>
        <button class="clear-button" id="clearButton" disabled>Clear All</button>
      </div>
      <div class="status" id="status">Connecting to StreamBIM...</div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
